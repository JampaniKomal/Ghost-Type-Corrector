[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]            # sys.path setup precedes imports by design
"ai_model/src/*" = ["E402"]     # numbered scripts set up paths/imports deliberately

[tool.pytest.ini_options]
testpaths = ["tests"]
